<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piece · CIRCLO</title>
<meta name="description" content="View this curated pre-owned piece on CIRCLO and send an enquiry.">
<meta name="theme-color" content="#702D42">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='22' fill='none' stroke='%23C8A96B' stroke-width='7'/></svg>">
</head>
<body data-page="product">
<a class="skip" href="#main">Skip to content</a>
<div data-header></div>
<main id="main">

<div class="container" style="padding-top:2rem">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="shop.html">Shop</a><span aria-hidden="true">/</span><a id="crumbCat" href="shop.html">…</a><span aria-hidden="true">/</span><span id="crumbTitle" aria-current="page"></span></nav>
  <div class="pd" id="pd" aria-live="polite"></div>
</div>
<section class="section tint" id="relatedWrap" hidden>
  <div class="container"><div class="sec-head split"><div><span class="eyebrow">Keep browsing</span><h2>You may also like</h2></div><a class="arrow-link" href="shop.html">Back to the shop</a></div><div class="grid" id="related"></div></div>
</section>
</main>
<div data-footer></div>
<dialog id="enqDlg" class="dlg" aria-labelledby="enqTitle">
  <button type="button" class="dlg-x" onclick="this.closest('dialog').close()" aria-label="Close">×</button>
  <form class="form" id="enqForm" novalidate>
    <div><span class="eyebrow">Enquiry</span><h2 id="enqTitle" style="font-size:2rem">Ask about this piece</h2><p class="muted small" id="enqFor"></p></div>
    <input type="hidden" name="productId">
    <label>Your name<input name="buyerName" required maxlength="80" autocomplete="name"></label>
    <label>Phone or email<input name="buyerContact" required maxlength="120" data-contact autocomplete="email"><span class="hint">So we can confirm availability and arrange delivery.</span></label>
    <label>Message <small>(optional)</small><textarea name="message" maxlength="800" rows="3" placeholder="Questions about size, condition, timing…"></textarea></label>
    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="check"><input type="checkbox" name="consent" required> CIRCLO may use these details to contact me about this enquiry, as described in the <a href="privacy.html" class="link">privacy policy</a>.</label>
    <div class="alert" id="enqMsg"></div>
    <button class="btn btn-block" type="submit">Send enquiry</button>
  </form>
  <div class="success" id="enqDone" hidden>
    <svg class="tick" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><path d="m26 41 9 9 19-20"/></svg>
    <h2 style="font-size:2rem">Enquiry sent</h2><span class="ref" id="enqRef"></span><p class="muted" id="enqNote"></p>
    <button class="btn btn-ghost" onclick="this.closest('dialog').close()">Done</button>
  </div>
</dialog>
<div class="lightbox" id="lightbox" tabindex="-1" role="dialog" aria-label="Enlarged photo"><img alt=""></div>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="pages.js"></script>
</body>
</html>
