<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop · CIRCLO</title>
<meta name="description" content="Browse curated pre-owned sarees, lehengas, jewellery, kurtis and handbags on CIRCLO.">
<meta name="theme-color" content="#702D42">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='22' fill='none' stroke='%23C8A96B' stroke-width='7'/></svg>">
</head>
<body data-page="shop">
<a class="skip" href="#main">Skip to content</a>
<div data-header></div>
<main id="main">

<section class="shop-hero">
  <div class="container"><nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>Shop</span></nav>
  <span class="eyebrow">The CIRCLO edit</span><h1 id="shopTitle" style="font-size:clamp(2.4rem,5vw,4rem)">The full edit</h1></div>
</section>
<div class="container shop">
  <div class="scrim" id="scrim"></div>
  <aside class="filters" id="filters" aria-label="Filters">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:1.6rem">Refine</h3><button class="icon-btn close-filters" id="closeFilters" aria-label="Close filters">×</button></div>
    <div class="fgroup"><h4>Category</h4><div class="chips" id="cats"></div></div>
    <div class="fgroup"><h4>Condition</h4><div class="chips" id="conds"></div></div>
    <div class="fgroup"><h4>Price (₹)</h4><div class="price-row"><input id="min" inputmode="numeric" placeholder="Min" aria-label="Minimum price"><input id="max" inputmode="numeric" placeholder="Max" aria-label="Maximum price"></div></div>
    <div class="fgroup"><h4>Availability</h4><label class="check" style="display:grid;gap:.5rem;font-size:.9rem"><input type="checkbox" id="showReserved" checked> Include reserved pieces</label></div>
  </aside>
  <section aria-labelledby="shopTitle">
    <div class="toolbar">
      <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search by name, fabric, style…" aria-label="Search pieces"></div>
      <button class="btn btn-ghost btn-sm filter-btn" id="filterBtn" aria-expanded="false" aria-controls="filters">Filters</button>
      <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
    </div>
    <div class="active-filters" id="active"></div>
    <p class="muted small" id="count" aria-live="polite" style="margin:-.5rem 0 1.5rem"></p>
    <div class="grid" id="grid"></div>
    <p class="center" style="margin-top:3rem"><button class="btn btn-ghost" id="more" hidden>Show more pieces</button></p>
  </section>
</div>
</main>
<div data-footer></div>

<script src="config.js"></script>
<script src="script.js"></script>
<script src="pages.js"></script>
</body>
</html>
